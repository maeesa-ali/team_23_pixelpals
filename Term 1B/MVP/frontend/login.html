 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PixelPals – Login</title>
</head>

<body>
<!-- Top blue bar -->
<header class="topBar">
    <img src="pixelPals.png" class="logo">

    <!-- Search Bar -->
    <div class="searchContainer">
        <input type="text" placeholder="Search">
    </div>

    <!-- Basket link -->
    <div class="topLinks">
        <a href="basket.html"> Basket</a>
    </div>
</header>

<!-- Bottom purple nav bar -->
<nav class="bottomNav">
    <a href="login.html"> Login</a>
    <a href="index.html"> Home</a>
    <a href="products.html"> Products</a>
    <a href="about.html"> About Us</a>
    <a href="contact.html"> Contact Us</a>
</nav>
<div class="pageWrapper"> <!-- Main container for the login page -->
    <!-- Login Form-->
    <form id="loginForm" action="../backend/login.php" method="POST" novalidate>
        <!-- Email input field-->
        <label>Email</label>
        <input type="email" id="loginEmail" name="email" required>

        <!-- Password input field-->
        <label>Password</label>
        <input type="password" id="loginPassword" name="password" required>

        <!-- Login button-->
        <button type="submit">Login</button>

        <!-- Links to registration page-->
        <a href="registration.html">Create Account</a>
    
        <p id="error" style="color:red;"></p> <!-- Error message display-->
    </form>
</div>
</body>
</html>

<!-- Styles for login form-->
<style>
    * 
    {
        box-sizing: border-box;
    }

   body /*overall page style*/
    {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(#DE4FFF, #77ADFF, #D5A4Ff);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .pageWrapper /* Main container*/
    {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    form /*form container styles*/
    {
        margin: 0 auto;
        background: #C9DAFF;
        padding: 20px;
        width: 400px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label /*input field labels*/
    {
        display: block;
        margin-top: 10px;
        font-weight: bold;
        font-size: 14px;
    }

    input /*input field styles*/
    {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    input:focus /*input focus styles*/
    {
        outline: none;
        border-color: #4A90E2;
        box-shadow: 0 0 5px rgba(74,144,226,0.5);
    }

    button /*login button styles*/
    {
        width: 100%;
        padding: 10px;
        margin-top: 15px;
        background: #C0ED45;
        color: black;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover /*login button hover styles*/
    {
        background: #3a7ac8;
    }

    a /*registration link styles*/
    {
        text-align: center;
        display: block;
        margin-top: 12px;
        color: #4A90E2;
        text-decoration: none;
    }

    a:hover /*registration link hover styles*/
    {
        text-decoration: underline;
    }

    #error, #success /*error and success message styles*/
    {
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
    }

    .topBar /* Top blue bar*/
    {
        background: #3F8BE0;
        display: flex;
        align-items: center;
        padding: 10px 20px;
        gap: 20px;
        width: 100%;
        box-sizing: border-box;
    }

    .topBar .logo /* Logo*/
    {
        height: 60px;
    }

    .searchContainer /* Search bar*/
    {
        flex: 1;
        position: relative;
    }

    .searchContainer input /* Search bar input field*/
    {
        width: 100%;
        padding: 12px 40px 12px 15px;
        border-radius: 20px;
        border: none;
        font-size: 16px;
    }

    .topLinks a /* Basket Link*/
    {
        color: white;
        font-size: 18px;
        margin-left: 20px;
        text-decoration: none;
    }

    .bottomNav /* Purple nav bar*/
    {
        background: #8962C6;
        display: flex;
        justify-content: space-evenly;
        padding: 10px 0;
        width: 100%;
        box-sizing: border-box;
    }

    .bottomNav a /* Navigation links*/
    {
        color: white;
        font-size: 18px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 5px;
    }
</style>
