<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome page</title>
  <link rel="stylesheet" type="text/css" href="css/styles.css" />
</head>

<body>

  <!-- Header -->
  <header class="topBar">
    <img src="pixelPals.png" class="logo">

    <div class="searchContainer">
      <form id="searchForm" action="products.html">
        <input type="text" id="searchInput" placeholder="Search">
      </form>
      <button class="clear-btn">×</button>
    </div>

    <div class="topLinks">
      <a href="basket.html">Basket</a>
    </div>
  </header>

  <!-- Bottom Navigation -->
  <nav class="bottomNav">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact Us</a>
    <a href="about.html">About Us</a>
  </nav>

  <!-- Page Content -->
  <main>

    <section id="welcome-message">
      <h2>Welcome to Pixel Pals!</h2>
      <p>Pixel Pals is great for finding gaming accessories for young children!</p>

      <form action="products.html" method="GET">
        <button type="submit" class="shop-now-btn">Shop Now!</button>
      </form>
    </section>

    <section class="card">
      <h2>Shop by Category</h2>

      <div class="category-buttons">

        <a href="products.html?q=headphones">
          <button class="cat-btn cat-headphones">Headphones</button>
        </a>

        <a href="products.html?q=headset">
          <button class="cat-btn cat-headsets">Headsets</button>
        </a>

        <a href="products.html?q=controller">
          <button class="cat-btn cat-controllers">Controllers</button>
        </a>

        <a href="products.html?q=keyboard">
          <button class="cat-btn cat-keyboards">Keyboards</button>
        </a>

        <a href="products.html?q=other">
          <button class="cat-btn cat-other">Other</button>
        </a>

      </div>
    </section>

    <section id="recommended">
      <h2>Recommended Products</h2>
      <div class="recommended-grid" id="recommendedGrid"></div>
    </section>



  </main>

  <script src="js/script.js"></script>

</body>
</html>
